<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mariner 2 probe">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd35c"/>
      <stop offset="100%" stop-color="#d9951f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3b5c"/>
      <stop offset="100%" stop-color="#11243d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45e6c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#45e6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd35c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd35c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- orbit -->
  <ellipse cx="256" cy="262" rx="200" ry="70" fill="none" stroke="#45e6c8" stroke-opacity="0.25" stroke-width="6" transform="rotate(-18 256 262)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="118" cy="128" r="5" opacity="0.8"/>
    <circle cx="400" cy="112" r="4" opacity="0.6"/>
    <circle cx="410" cy="380" r="5" opacity="0.7"/>
    <circle cx="104" cy="372" r="3.5" opacity="0.5"/>
  </g>

  <!-- signal -->
  <g fill="none" stroke="#45e6c8" stroke-linecap="round">
    <path d="M206 132 A70 70 0 0 1 306 132" stroke-width="16"/>
    <path d="M226 104 A45 45 0 0 1 286 104" stroke-width="12" stroke-opacity="0.6"/>
  </g>

  <circle cx="256" cy="256" r="120" fill="url(#glow)"/>

  <!-- panels -->
  <g stroke="#45e6c8" stroke-width="8" stroke-linejoin="round">
    <rect x="70" y="214" width="112" height="72" rx="10" fill="url(#panel)"/>
    <rect x="330" y="214" width="112" height="72" rx="10" fill="url(#panel)"/>
  </g>
  <g stroke="#45e6c8" stroke-width="4" stroke-opacity="0.55">
    <line x1="107" y1="218" x2="107" y2="282"/><line x1="145" y1="218" x2="145" y2="282"/>
    <line x1="367" y1="218" x2="367" y2="282"/><line x1="405" y1="218" x2="405" y2="282"/>
    <line x1="74" y1="250" x2="178" y2="250"/><line x1="334" y1="250" x2="438" y2="250"/>
  </g>
  <rect x="180" y="243" width="152" height="14" rx="7" fill="#d9951f"/>

  <!-- resin vat beam / thruster -->
  <path d="M232 328 L280 328 L300 420 L212 420 Z" fill="url(#beam)" opacity="0.55"/>

  <!-- body -->
  <polygon points="256,166 318,202 318,274 256,310 194,274 194,202" fill="url(#gold)" stroke="#8a5a0c" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="256" cy="238" r="34" fill="#0b1426" stroke="#45e6c8" stroke-width="9"/>
  <circle cx="256" cy="238" r="12" fill="#45e6c8"/>
  <path d="M228 312 L284 312 L294 340 L218 340 Z" fill="#1d3b5c" stroke="#45e6c8" stroke-width="7" stroke-linejoin="round"/>
</svg>
