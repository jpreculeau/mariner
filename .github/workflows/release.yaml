---
name: "Build & Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - codename: bookworm
            arch: amd64
            docker_platform: linux/amd64
          - codename: bookworm
            arch: arm64
            docker_platform: linux/arm64
          - codename: bookworm
            arch: armhf
            docker_platform: linux/arm/v7
          - codename: trixie
            arch: amd64
            docker_platform: linux/amd64
          - codename: trixie
            arch: arm64
            docker_platform: linux/arm64
          - codename: trixie
            arch: armhf
            docker_platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/src -w /src \
            debian:${{ matrix.codename }} bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential curl debhelper dh-virtualenv dpkg-dev \
                git libffi-dev libssl-dev libxml2-dev libxslt-dev \
                nodejs npm pkg-config python3 python3-dev python3-pip \
                python3-venv python3-virtualenv zlib1g-dev

              # Install Poetry
              curl -sSL https://install.python-poetry.org | python3 -
              export PATH="/root/.local/bin:$PATH"

              # Update version from git tag
              VERSION='"${{ steps.version.outputs.version }}"'
              CODENAME='"${{ matrix.codename }}"'
              poetry version "$VERSION"
              # Distinct Debian revisions per codename so reprepro pool paths do not
              # collide (bookworm vs trixie produce different .deb contents).
              sed -i "1s/([^)]*)/(${VERSION}-1+${CODENAME})/" dist/debian/changelog

              # Build frontend
              cd frontend && npm install && npm run build && cd ..

              # Build Python sdist (used by dh-virtualenv)
              poetry build

              # Pin runtime dependencies to poetry.lock. dh-virtualenv resolves
              # with pip and ignores the lock, so without this the packaged venv
              # drifts from the tested set on any new upstream release.
              poetry self add poetry-plugin-export
              poetry export --only main --without-hashes \
                --format requirements.txt --output dist/requirements.txt

              # Build .deb (dpkg-buildpackage runs from dist/ where debian/ lives,
              # and produces .deb files one directory up in /src)
              export DEB_BUILD_OPTIONS=noautodbgsym
              cd dist && dpkg-buildpackage -us -uc -b && cd ..

              # Collect output
              mkdir -p output
              cp /src/*.deb output/ 2>/dev/null || cp /*.deb output/ 2>/dev/null
              test -n "$(ls output/*.deb 2>/dev/null)" || { echo "ERROR: No .deb files produced"; exit 1; }
              # Fail fast if .deb architecture does not match the build (avoids wrong APT metadata)
              EXPECT_ARCH=${{ matrix.arch }}
              for f in output/*.deb; do
                DEB_ARCH=$(dpkg-deb -f "$f" Architecture)
                if [ "$DEB_ARCH" != "$EXPECT_ARCH" ]; then
                  echo "ERROR: $f has Architecture=$DEB_ARCH, expected $EXPECT_ARCH"
                  exit 1
                fi
              done
              echo "Depends/Pre-Depends (sanity check):"
              dpkg-deb -f output/mariner3d_*.deb Pre-Depends Depends || true
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.codename }}-${{ matrix.arch }}
          path: output/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .rpm package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/build -w /build \
            rockylinux:9 bash -c '
              set -e
              VERSION='"${{ steps.version.outputs.version }}"'

              # EL9, like every other rpm on packages.alejandro.md. Two
              # repositories need switching on first: libxslt-devel is in
              # CRB, and the default nodejs (16) is too old for Vite 5.
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf module enable -y nodejs:22
              dnf install -y \
                gcc make python3.12 python3.12-devel python3.12-pip \
                python3.12-setuptools libffi-devel openssl-devel \
                libxml2-devel libxslt-devel zlib-devel rpm-build \
                systemd-rpm-macros nodejs npm git

              # Poetry on the interpreter the package is built for.
              curl -sSL https://install.python-poetry.org | python3.12 -
              export PATH="/root/.local/bin:$PATH"

              # Update version and build sdist
              poetry version "$VERSION"
              poetry build

              # Pin runtime dependencies to poetry.lock (see the .deb job).
              poetry self add poetry-plugin-export
              poetry export --only main --without-hashes \
                --format requirements.txt --output dist/requirements.txt

              # Build frontend
              cd frontend && npm install && npm run build && cd ..

              # Create rpmbuild structure
              mkdir -p /root/rpmbuild/{SOURCES,SPECS}
              cp dist/mariner-${VERSION}.tar.gz /root/rpmbuild/SOURCES/
              cp dist/rpm/mariner3d.spec /root/rpmbuild/SPECS/

              # Build RPM
              rpmbuild -bb \
                --define "_version ${VERSION}" \
                /root/rpmbuild/SPECS/mariner3d.spec

              mkdir -p /build/output
              cp /root/rpmbuild/RPMS/*/*.rpm /build/output/
            '

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-${{ matrix.arch }}
          path: output/*.rpm

  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            amd989/mariner3d
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-deb, build-rpm, build-container]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{deb-*,rpm-*}"
          path: packages-raw
          merge-multiple: false

      - name: Flatten packages for release (unique .deb names per codename)
        run: |
          set -e
          mkdir -p packages
          shopt -s nullglob
          rpms=(packages-raw/rpm-*/*.rpm)
          debs=(packages-raw/deb-*/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "ERROR: no .deb under packages-raw/deb-*" >&2
            ls -laR packages-raw || true
            exit 1
          fi
          for rpm in "${rpms[@]}"; do
            [ -f "$rpm" ] && cp "$rpm" packages/
          done
          for deb in "${debs[@]}"; do
            artifact_dir=$(basename "$(dirname "$deb")")
            cp "$deb" "packages/${artifact_dir}_$(basename "$deb")"
          done
          ls -la packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            packages/*.deb
            packages/*.rpm
          generate_release_notes: true

  # Packages are published centrally by amd989/packages, which serves
  # packages.alejandro.md. This repository builds, attaches the artifacts to
  # its own GitHub Release, and asks the publisher to pick that release up.
  # The signing key and the storage credentials live only over there.
  publish:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to packages.alejandro.md
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PACKAGES_DISPATCH_TOKEN is not set. The release exists, but packages.alejandro.md was not asked to publish it. Set the secret, then run the publish workflow in amd989/packages by hand for $REPO $TAG."
            exit 1
          fi
          # -f rather than -F: -F converts values that look like numbers or
          # booleans, and the publisher expects the tag as a string.
          gh api repos/amd989/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[tag]=$TAG"
          {
            echo "### Asked packages.alejandro.md to publish \`$REPO\` \`$TAG\`"
            echo
            echo "Follow it at https://github.com/amd989/packages/actions/workflows/publish.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
