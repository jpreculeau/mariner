# mariner configuration file
# =============================================================================
# This file holds the configuration of mariner. It can be placed on either of
# the following paths:
#   * ./config.toml (the running directory)
#   * ~/.mariner/config.toml (home directory)
#   * /etc/mariner/config.toml
#
# The config is formatted in the TOML format, see https://toml.io/en/ for
# details on how TOML formats work.

# The directory to which files should be uploaded. This is usually the same
# directory that you are sharing to the printer through the USB Gadget
files_directory = "/mnt/usb_share"

# Global application log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = "INFO"

[printer]
# The name which will be displayed for the printer in the UI. By default no
# printer name is displayed. Uncomment this line and set it to whatever you
# want if you want to show a name on the print status. Useful for people with
# multiple printers running multiple instances of mariner.
#display_name = "Elegoo Mars Pro"

# Serial port settings. Most of the time the default values are fine. This
# is generally only helpful if you aren't running mariner on a Raspberry Pi
# or if you are running with a printer that uses a different baud rate.
serial_port = "/dev/serial0"
baudrate = 115200

[http]
# Hostname or IP address (string) on which to listen. Default is 0.0.0.0, which
# means "all IP addresses on this host". Note that listening on 0.0.0.0 assumes
# that your mariner instance is running on a trusted network.
host = "0.0.0.0"
# TCP port on which to listen
port = 5000
# Names Mariner answers to, besides its IP address and the names of a local
# network (one word, the name of this computer, or a name ending in .local,
# .lan, .home, .home.arpa, .internal or .localdomain). Needed only to reach
# it under another name, given here without a port; "*" allows any name,
# which lets a web site that points its own name at the printer drive it.
#allowed_hosts = ["printer.example.org"]
# Addresses at which Mariner's page is served, when a relay (nginx, Caddy)
# stands in front of it and asks Mariner under another name, port or scheme
# than the browser used. Each as the browser shows it, scheme included.
#allowed_origins = ["https://printer.example.org"]
# Largest file accepted, in megabytes, from the web page and from slicers.
# Default is 2048.
max_upload_size_mb = 2048
# Where a file is kept while it arrives. It must be on a drive: in /tmp, which
# on current systems is held in memory, a large file would not fit. Default is
# /var/tmp.
spool_directory = "/var/tmp"

[cache]
# Directory in which cached information such as file metadata and thumbnails
# will be stored. Emptied at each start. Default is /var/cache/mariner, which
# the service is given; if it cannot be used Mariner says so in the log and
# uses a folder of its own under /tmp.
#directory = "/var/cache/mariner"

[https]
# Mariner serves its page over HTTPS by itself, on this port; the port under
# [http] stays for slicers and sends browsers on. Set enabled to false only
# where something else encrypts the connection (a relay on this computer).
#enabled = true
#port = 5443
# A certificate of your own and its key, in place of the one Mariner makes
# for itself. Both readable by Mariner's account, the key by nobody else.
#certificate = "/etc/mariner/printer.pem"
#key = "/etc/mariner/printer.key"

[internet]
# Some of what Mariner does is kept for the local network: what serves
# slicers (they give no password), and stopping or restarting the computer.
# Local is this computer, the private ranges (10.x, 172.16-31.x, 192.168.x),
# those a VPN gives, and over IPv6 the network this computer is in.
# Networks to take for local besides those:
#local_networks = ["203.0.113.0/24"]
# Addresses or networks that are NOT local whatever they look like. Needed
# where the Internet arrives under a local address: a router that passes
# connections on under its own address, a tunnel or a relay on this computer
# (then "127.0.0.1").
#not_local = ["192.168.1.1"]
# Let who is signed in stop or restart the computer from the Internet.
#host_commands = false
# The name Mariner is reached under from the Internet: answered to besides
# its address and local names.
#public_name = "printer.example.org"
# The port the router listens on for HTTPS, where it is not Mariner's own.
#public_port = 443

[state]
# Directory in which Mariner keeps what must outlast a restart, for itself
# alone: the key that signs sessions, the password's hash, the settings
# changed from its page, the history of prints shown to slicers. Default is
# /var/lib/mariner, which the service is given. Run several instances on one
# computer with a directory each.
#directory = "/var/lib/mariner"

# Interfaces for slicers. Both are on unless switched off here or in the
# page's settings, which come first. Neither is behind Mariner's password:
# slicers cannot give one. Switch off what you do not use.
[uvtools]
# Routes UVtools sends files and commands to, on the port of the web page.
enabled = true

[sdcp]
# The protocol ChiTuBox speaks: discovery on UDP port 3000, WebSocket and
# uploads on TCP port 3030.
enabled = true
